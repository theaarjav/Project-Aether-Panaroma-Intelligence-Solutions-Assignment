version: '3.8'

services:
  # API Gateway - Main proxy service
  gateway:
    build:
      context: .
      dockerfile: cmd/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgres://aether:aether123@postgres:5432/aether?sslmode=disable
      - UPSTREAM_URLS=http://upstream1:3001,http://upstream2:3002
      - LOG_LEVEL=info
    depends_on:
      - postgres
      - redis
      - nats
      - upstream1
      - upstream2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Configuration Service
  config-service:
    build:
      context: .
      dockerfile: cmd/config/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - CONFIG_PORT=8081
      - DB_URL=postgres://aether:aether123@postgres:5432/aether?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Analysis Service - Background anomaly detection
  analysis:
    build:
      context: .
      dockerfile: cmd/analysis/Dockerfile
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgres://aether:aether123@postgres:5432/aether?sslmode=disable
      - ANALYSIS_WINDOW_MINUTES=60
      - ANOMALY_THRESHOLD_SIGMA=3
      - ANOMALY_TTL_MINUTES=5
      - LOG_LEVEL=info
    depends_on:
      - postgres
      - redis
      - nats
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=aether
      - POSTGRES_USER=aether
      - POSTGRES_PASSWORD=aether123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # NATS Message Queue
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"  # HTTP monitoring
    command: ["-js", "-m", "8222"]
    restart: unless-stopped

  # Mock Upstream Services
  upstream1:
    build:
      context: .
      dockerfile: cmd/upstream/Dockerfile
    environment:
      - PORT=3001
      - SERVICE_NAME=upstream1
    ports:
      - "3001:3001"

  upstream2:
    build:
      context: .
      dockerfile: cmd/upstream/Dockerfile
    environment:
      - PORT=3002
      - SERVICE_NAME=upstream2
    ports:
      - "3002:3002"

  # Prometheus (Optional monitoring)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: aether-network